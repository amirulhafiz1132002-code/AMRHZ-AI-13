name: AutoPilot Regression Tests

on:
  push:
    branches:
      - "remediation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  autopilot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run AutoPilot regression tests
        run: python -m pytest -q tests/test_autopilot_success_rate.py
